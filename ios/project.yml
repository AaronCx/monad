name: Monad
options:
  bundleIdPrefix: com.aaroncx
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P6VJJ7XQN9
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Monad:
    type: application
    platform: iOS
    sources:
      - Monad
    settings:
      base:
        # Locked into App Store Connect at the first upload (app 6824323496).
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.monad
        PRODUCT_NAME: Monad
        INFOPLIST_FILE: Monad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  MonadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MonadTests
    dependencies:
      - target: Monad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.monad.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Monad.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Monad"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MonadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MonadUITests
    dependencies:
      - target: Monad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.monad.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Monad
schemes:
  Monad:
    build:
      targets:
        Monad: all
        MonadTests: [test]
        MonadUITests: [test]
    test:
      targets:
        - MonadTests
        - MonadUITests
