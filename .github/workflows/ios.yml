name: iOS

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Match the Mac mini's Xcode (26.5) when the image has it.
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      # Unit tests run in full; the live UI test skips (no daemon on the runner).
      - name: Build and test
        run: make test SIM="iPhone 17" DEVELOPER_DIR="$DEVELOPER_DIR"
