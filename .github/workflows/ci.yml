name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.x"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck (tsc --noEmit per package)
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build single binaries
        run: bun run build
      - name: Smoke test the binaries
        run: |
          ./apps/daemon/dist/monadd --version
          ./apps/cli/dist/monad --version
